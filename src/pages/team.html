<section class="banner navy grid-bg">
  <div class="wrap">
    <div class="stack">
      <p class="eyebrow" data-rv>Team</p>
      <h1 data-split>Architects, Engineers &amp; <em>Quantity Surveyors</em></h1>
      <p class="lead" data-rv>A studio of {{teamCount}} people in Hyderabad, led by Er. C.A. Prasad.</p>
    </div>
    <div class="b-art" data-art="team" data-in>{{art:team}}</div>
  </div>
</section>

<section class="sec" id="founder">
  <div class="wrap founder">{{founder}}</div>
</section>

<section class="sec sand" id="people">
  <div class="wrap stack" style="gap:clamp(3rem,6vw,4.5rem)">{{teamGroups}}</div>
</section>

<section class="sec navy grid-bg" id="director-experience">
  <div class="wrap">
    <div class="head">
      <p class="eyebrow" data-rv>Director's International Experience</p>
      <h2 data-split>Before METEY: <em>The Middle East</em></h2>
    </div>
    <div class="xp-wrap">{{experience}}</div>
  </div>
</section>

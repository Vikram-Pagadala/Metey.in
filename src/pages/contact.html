<section class="banner navy grid-bg">
  <div class="wrap">
    <div class="stack">
      <p class="eyebrow" data-rv>Contact</p>
      <h1 data-split>Initiate a Consultation with <em>Our Practice</em></h1>
    </div>
    <div class="b-art" data-art="contact" data-in>{{art:contact}}</div>
  </div>
</section>
<section class="sec">
  <div class="wrap two">
    <div>
      <div class="contact-list" data-rv>{{contactList}}</div>
    </div>
    <form id="enquiry" data-rv="r" data-endpoint="{{endpoint}}" data-email="{{email}}" data-cc="{{emailCc}}" data-whatsapp="{{whatsapp}}" novalidate>
      <span class="corner a"></span><span class="corner b"></span><span class="corner c"></span><span class="corner d"></span>
      <h2 class="h3">Enquiry</h2>
      <div class="row2">
        <div class="fl"><input id="f-name" name="name" autocomplete="name" placeholder=" " required><label for="f-name">Name</label></div>
        <div class="fl"><input id="f-phone" name="phone" type="tel" autocomplete="tel" placeholder=" "><label for="f-phone">Phone</label></div>
      </div>
      <div class="row2">
        <div class="fl"><input id="f-email" name="email" type="email" autocomplete="email" placeholder=" " required><label for="f-email">Email</label></div>
        <div class="fl">
          <select id="f-service" name="service">
            {{serviceOptions}}
          </select>
          <label for="f-service">Service</label>
        </div>
      </div>
      <div class="fl"><textarea id="f-msg" name="message" placeholder=" " required></textarea><label for="f-msg">About the project</label></div>
      <div class="hp" aria-hidden="true"><label for="f-website">Leave this empty</label><input id="f-website" name="website" tabindex="-1" autocomplete="off"></div>
      <div class="actions"><button class="btn" type="submit">Send enquiry <svg aria-hidden="true"><use href="#arr"/></svg></button></div>
      <div class="status" id="formStatus" role="status" aria-live="polite"></div>
      <div class="quick-contact">
        <a class="more" href="tel:{{phoneLink}}">Call {{phone}}</a>
        <a class="more" href="https://wa.me/{{whatsapp}}?text=Hello%20METEY%20Engineering%2C%20I%20would%20like%20to%20discuss%20a%20structural%20project." target="_blank" rel="noopener">WhatsApp desk</a>
        <a class="more" href="/assets/metey-contact.vcf" download>Save vCard</a>
      </div>
    </form>
  </div>
</section>
